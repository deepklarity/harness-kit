<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PR Task Summary</title>
<style>
  :root{
    --bg: #0A0C10;
    --panel: #12151C;
    --panel-hover: #161A23;
    --border: #212530;
    --text: #E6E8EC;
    --text-dim: #8B93A7;
    --text-faint: #7A8296;
    --accent: #4FD1C5;
    --accent-dim: rgba(79,209,197,0.12);
    --merged: #34D399;
    --merged-bg: rgba(52,211,153,0.10);
    --review: #FBBF24;
    --review-bg: rgba(251,191,36,0.10);
    --blocked: #F87171;
    --blocked-bg: rgba(248,113,113,0.10);
    --in_progress: #60A5FA;
    --in_progress-bg: rgba(96,165,250,0.10);
    --waiting: #A78BFA;
    --waiting-bg: rgba(167,139,250,0.10);
    --mono: 'SF Mono', 'JetBrains Mono', ui-monospace, 'Cascadia Code', Menlo, Consolas, monospace;
    --sans: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', system-ui, sans-serif;
  }
  *{ box-sizing: border-box; }
  body{
    margin:0;
    background: var(--bg);
    background-image:
      radial-gradient(circle at 15% 0%, rgba(79,209,197,0.05), transparent 40%),
      radial-gradient(circle at 85% 15%, rgba(96,165,250,0.04), transparent 35%);
    color: var(--text);
    font-family: var(--sans);
    line-height: 1.5;
    padding: 0 0 80px 0;
  }
  a{ color: inherit; }
  button{ font: inherit; }
  button:focus-visible, a:focus-visible, input:focus-visible{
    outline: 2px solid var(--accent);
    outline-offset: 2px;
    border-radius: 4px;
  }
  .visually-hidden{
    position:absolute; width:1px; height:1px; overflow:hidden;
    clip:rect(0,0,0,0); white-space:nowrap; border:0; padding:0; margin:-1px;
  }

  .wrap{ max-width: 880px; margin: 0 auto; padding: 56px 24px 0; transition: max-width .15s ease; }
  body.mode-board .wrap{ max-width: 1400px; }

  header.report-head{
    margin-bottom: 28px;
    padding-bottom: 28px;
    border-bottom: 1px solid var(--border);
  }
  .eyebrow{
    font-family: var(--mono);
    font-size: 12px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--accent);
    margin: 0 0 10px 0;
  }
  h1{
    font-size: 30px;
    font-weight: 650;
    letter-spacing: -0.01em;
    margin: 0 0 8px 0;
  }
  .meta{
    font-family: var(--mono);
    font-size: 13px;
    color: var(--text-faint);
  }
  .summary-strip{
    display:flex;
    gap: 18px;
    margin-top: 22px;
    flex-wrap: wrap;
  }
  .stat{
    font-family: var(--mono);
    font-size: 13px;
    color: var(--text-dim);
    padding: 6px 12px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--panel);
  }
  .stat b{ color: var(--text); font-weight: 600; }

  /* ---- controls / filters (sticky) ---- */
  .controls{
    position: sticky;
    top: 0;
    z-index: 20;
    display:flex;
    flex-wrap: wrap;
    gap: 18px;
    align-items: flex-end;
    padding: 14px 18px;
    margin: 0 0 10px 0;
    background: rgba(18,21,28,0.92);
    backdrop-filter: blur(8px);
    border: 1px solid var(--border);
    border-radius: 10px;
  }
  .control-group{ display:flex; flex-direction:column; gap: 8px; }
  .control-label{
    font-family: var(--mono);
    font-size: 10.5px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--text-faint);
  }
  .chip-row{ display:flex; flex-wrap: wrap; gap: 6px; }
  .chip{
    font-family: var(--mono);
    font-size: 11.5px;
    color: var(--text-dim);
    background: transparent;
    border: 1px solid var(--border);
    border-radius: 100px;
    padding: 5px 11px;
    cursor: pointer;
    transition: all .12s ease;
    white-space: nowrap;
  }
  .chip .chip-count{ color: var(--text-faint); }
  .chip:hover{ border-color: #3A4152; color: var(--text); }
  .chip.active{
    color: var(--bg);
    background: var(--accent);
    border-color: var(--accent);
    font-weight: 600;
  }
  .chip.active .chip-count{ color: rgba(10,12,16,0.65); }
  .chip.active[data-value="review"]{ background: var(--review); border-color: var(--review); }
  .chip.active[data-value="blocked"]{ background: var(--blocked); border-color: var(--blocked); }
  .chip.active[data-value="waiting"]{ background: var(--waiting); border-color: var(--waiting); }
  .chip.active[data-value="in_progress"]{ background: var(--in_progress); border-color: var(--in_progress); }
  .chip.active[data-value="merged"]{ background: var(--merged); border-color: var(--merged); }
  .view-toggle{ margin-left: auto; }
  #clear-filters{
    display:none;
    font-family: var(--mono);
    font-size: 11.5px;
    color: var(--text-dim);
    background: transparent;
    border: 1px dashed var(--border);
    border-radius: 100px;
    padding: 5px 11px;
    cursor: pointer;
    align-self: flex-end;
  }
  #clear-filters:hover{ color: var(--text); border-color: var(--text-faint); }
  #clear-filters.visible{ display:inline-block; }

  #result-count{
    font-family: var(--mono);
    font-size: 12px;
    color: var(--text-faint);
    margin: 0 0 22px 2px;
  }

  .empty-state{
    display:none;
    padding: 40px 20px;
    text-align:center;
    color: var(--text-faint);
    font-family: var(--mono);
    font-size: 13px;
    border: 1px dashed var(--border);
    border-radius: 10px;
    margin-bottom: 44px;
  }

  /* ---- linear (default) layout ---- */
  .person-section{
    display:flex;
    gap: 20px;
    margin-bottom: 44px;
  }
  .rail{
    flex: none;
    width: 20px;
    position: relative;
    display:flex;
    justify-content:center;
  }
  .rail::before{
    content:"";
    position:absolute;
    top: 8px; bottom: 0;
    width: 1px;
    background: var(--border);
  }
  .rail .node{
    position: relative;
    z-index: 1;
    width: 10px; height: 10px;
    border-radius: 50%;
    background: var(--accent);
    margin-top: 3px;
    box-shadow: 0 0 0 4px var(--bg);
  }
  .person-body{ flex: 1; min-width: 0; }

  /* ---- board (side-by-side) layout ---- */
  body.mode-board .sections{
    display:flex;
    gap: 20px;
    align-items: flex-start;
    overflow-x: auto;
    padding-bottom: 16px;
    margin-bottom: 44px;
  }
  body.mode-board .person-section{
    flex: 0 0 300px;
    margin-bottom: 0;
  }
  body.mode-board .rail{ display:none; }
  body.mode-board .person-body{
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px;
  }
  .board-status-summary{
    display:none;
    flex-wrap: wrap;
    gap: 5px;
    margin-bottom: 14px;
  }
  body.mode-board .board-status-summary{ display:flex; }
  .board-status-summary span{
    font-family: var(--mono);
    font-size: 10px;
    padding: 2px 7px;
    border-radius: 100px;
    border: 1px solid var(--border);
    color: var(--text-dim);
  }

  .person-name{
    font-size: 18px;
    font-weight: 650;
    margin: 0 0 2px 0;
  }
  .person-counts{
    font-family: var(--mono);
    font-size: 12px;
    color: var(--text-faint);
    margin-bottom: 16px;
  }

  .task-card{
    background: var(--panel);
    border: 1px solid var(--border);
    border-left: 3px solid var(--border);
    border-radius: 10px;
    padding: 16px 18px;
    margin-bottom: 12px;
    transition: border-color .15s ease;
  }
  .task-card[data-status="review"]{ border-left-color: var(--review); }
  .task-card[data-status="blocked"]{ border-left-color: var(--blocked); }
  .task-card[data-status="waiting"]{ border-left-color: var(--waiting); }
  .task-card[data-status="in_progress"]{ border-left-color: var(--in_progress); }
  .task-card[data-status="merged"]{ border-left-color: var(--merged); }
  body.mode-board .task-card{ background: var(--bg); }
  .task-card:hover{ border-color: #2C3140; background: var(--panel-hover); }
  .task-card[data-status="review"]:hover{ border-left-color: var(--review); }
  .task-card[data-status="blocked"]:hover{ border-left-color: var(--blocked); }
  .task-card[data-status="waiting"]:hover{ border-left-color: var(--waiting); }
  .task-card[data-status="in_progress"]:hover{ border-left-color: var(--in_progress); }
  .task-card[data-status="merged"]:hover{ border-left-color: var(--merged); }
  .task-card.is-hidden{ display:none; }
  .person-section.is-hidden{ display:none; }

  .merged-group{ margin-top: 4px; }
  .merged-group summary{
    cursor: pointer;
    font-family: var(--mono);
    font-size: 12px;
    color: var(--text-faint);
    padding: 8px 4px;
    list-style: none;
  }
  .merged-group summary::-webkit-details-marker{ display:none; }
  .merged-group summary::before{ content: "▸ "; color: var(--text-faint); }
  .merged-group[open] summary::before{ content: "▾ "; }
  .merged-cards .task-card{ opacity: 0.8; }

  .task-top{
    display:flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 6px;
  }
  .task-title{
    font-size: 14.5px;
    font-weight: 600;
    color: var(--text);
    margin: 0;
  }
  .task-date{
    font-family: var(--mono);
    font-size: 11px;
    color: var(--text-faint);
    margin: 2px 0 10px 0;
  }
  .pill{
    font-family: var(--mono);
    font-size: 10.5px;
    letter-spacing: 0.03em;
    text-transform: uppercase;
    padding: 3px 9px;
    border-radius: 100px;
    white-space: nowrap;
    flex: none;
  }
  .pill.merged{ color: var(--merged); background: var(--merged-bg); }
  .pill.review{ color: var(--review); background: var(--review-bg); }
  .pill.blocked{ color: var(--blocked); background: var(--blocked-bg); }
  .pill.in_progress{ color: var(--in_progress); background: var(--in_progress-bg); }
  .pill.waiting{ color: var(--waiting); background: var(--waiting-bg); }

  .task-summary{
    font-size: 13.5px;
    color: var(--text-dim);
    margin: 0 0 10px 0;
  }
  .status-note, .action-line{
    font-family: var(--mono);
    font-size: 11.5px;
    color: var(--text-faint);
    margin: 0 0 6px 0;
  }
  .status-note strong, .action-line strong{
    color: var(--text-dim);
    font-weight: 600;
  }
  .action-line{ margin-bottom: 12px; color: var(--text-dim); }
  .task-links{
    display:flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 12px;
  }
  .task-links a{
    font-family: var(--mono);
    font-size: 12px;
    color: var(--accent);
    text-decoration: none;
    border: 1px solid var(--border);
    background: var(--accent-dim);
    padding: 4px 10px;
    border-radius: 6px;
  }
  .task-links a:hover{ border-color: var(--accent); }
  .task-links a.slack{
    color: var(--in_progress);
    background: var(--in_progress-bg);
  }
  .shared-tag{
    font-size: 9.5px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    opacity: 0.75;
  }

  footer{
    max-width: 880px;
    margin: 40px auto 0;
    padding: 20px 24px 0;
    border-top: 1px solid var(--border);
    font-family: var(--mono);
    font-size: 11.5px;
    color: var(--text-faint);
  }
  body.mode-board footer{ max-width: 1400px; }

  @media (max-width: 560px){
    .wrap{ padding: 36px 16px 0; }
    h1{ font-size: 24px; }
    .rail{ width: 14px; }
    .view-toggle{ margin-left: 0; }
    .controls{ position: static; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="report-head">
    <p class="eyebrow">Team Update</p>
    <h1 id="report-title"></h1>
    <div class="meta" id="meta-line"></div>
    <div class="summary-strip">
      <span class="stat"><b id="contributors-count">0</b> contributors</span>
      <span class="stat"><b id="open-count">0</b> open</span>
      <span class="stat"><b id="closed-count">0</b> merged/closed</span>
    </div>
  </header>

  <div class="controls">
    <div class="control-group">
      <span class="control-label">Status</span>
      <div class="chip-row" data-filter-group="status" role="group" aria-label="Filter by status">
        <button class="chip active" role="checkbox" aria-checked="true" data-filter-type="status" data-value="all">All</button>
      </div>
    </div>
    <div class="control-group">
      <span class="control-label">Contributor</span>
      <div class="chip-row" data-filter-group="person" role="group" aria-label="Filter by contributor">
        <button class="chip active" role="checkbox" aria-checked="true" data-filter-type="person" data-value="all">All</button>
      </div>
    </div>
    <div class="control-group view-toggle">
      <div class="chip-row" role="group" aria-label="Switch layout">
        <button class="chip active" id="view-linear" aria-pressed="true" data-view="linear">Linear</button>
        <button class="chip" id="view-board" aria-pressed="false" data-view="board">Board</button>
      </div>
    </div>
    <button id="clear-filters">Clear filters</button>
  </div>

  <p id="result-count" aria-live="polite"></p>
  <div class="empty-state" id="empty-state">No tasks match the current filters.</div>

  <div class="sections" id="sections">
  </div>

  <footer id="footer-line"></footer>
</div>

<script type="application/json" id="pr-summary-data">
{
  "title": "Team PR & Task Summary",
  "generated_date": "August 4, 2026",
  "period": "Aug 4, 2026",
  "people": [
    {
      "name": "Example Contributor",
      "open_tasks": [
        {
          "title": "Sample Review Task",
          "summary": "Replace this sample JSON block with real task data before publishing the report.",
          "status": "PR raised; awaiting review",
          "status_type": "review",
          "action": "Review needed",
          "prs": [{"label": "Example #1", "url": "https://example.com/pr/1"}]
        }
      ],
      "closed_tasks": []
    }
  ]
}
</script>

<script>
(function(){
  var STATUS_LABELS = {
    review: 'Needs Review',
    in_progress: 'In Progress',
    blocked: 'Blocked',
    waiting: 'Waiting on Dependency',
    merged: 'Merged'
  };
  var STATUS_PRIORITY = {blocked: 0, review: 1, waiting: 2, in_progress: 3, merged: 9};
  var STATUS_COUNT_LABELS = {
    review: 'awaiting review',
    blocked: 'blocked',
    waiting: 'waiting on dependency',
    in_progress: 'in progress',
    merged: 'merged'
  };

  function el(id){ return document.getElementById(id); }
  function normStatus(status){ return STATUS_LABELS[status] ? status : 'in_progress'; }
  function escapeHtml(value){
    return String(value || '').replace(/[&<>"']/g, function(ch){
      return {'&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;'}[ch];
    });
  }

  function allTasks(person){
    return (person.open_tasks || []).concat(person.closed_tasks || []);
  }

  function sharedPrMap(people){
    var map = {};
    people.forEach(function(person){
      allTasks(person).forEach(function(task){
        (task.prs || []).forEach(function(pr){
          if(!map[pr.url]){ map[pr.url] = []; }
          map[pr.url].push(task.title);
        });
      });
    });
    return map;
  }

  function renderPill(status){
    var st = normStatus(status);
    return '<span class="pill ' + st + '">' + STATUS_LABELS[st] + '</span>';
  }

  function renderTask(task, personName, shared){
    var st = normStatus(task.status_type);
    var title = task.title || 'Untitled Task';
    var links = (task.prs || []).map(function(pr){
      var others = (shared[pr.url] || []).filter(function(other){ return other !== title; });
      var sharedAttr = others.length ? ' title="Also covers: ' + escapeHtml(others.join(', ')) + '"' : '';
      var sharedBadge = others.length ? ' <span class="shared-tag" aria-hidden="true">shared</span>' : '';
      var aria = escapeHtml((pr.label || 'PR') + ' pull request for ' + title);
      return '<a href="' + escapeHtml(pr.url) + '" target="_blank" rel="noopener" aria-label="' + aria + '"' + sharedAttr + '>' +
        escapeHtml(pr.label || pr.url) + sharedBadge + '</a>';
    });
    if(task.slack_thread){
      links.push('<a class="slack" href="' + escapeHtml(task.slack_thread) + '" target="_blank" rel="noopener" aria-label="Slack discussion thread for ' + escapeHtml(title) + '">Slack thread</a>');
    }
    var statusLine = task.status ? '<p class="status-note"><strong>Status:</strong> ' + escapeHtml(task.status) + '</p>' : '';
    var action = task.action || (st !== 'merged' ? task.status : '');
    var actionLine = action && st !== 'merged' ? '<p class="action-line"><strong>Action:</strong> ' + escapeHtml(action) + '</p>' : '';
    var linksHtml = links.length ? '<div class="task-links">' + links.join('') + '</div>' : '';
    var dateHtml = task.opened_date ? '<p class="task-date">Opened ' + escapeHtml(task.opened_date) + '</p>' : '';

    return '<div class="task-card" data-status="' + st + '" data-person="' + escapeHtml(personName) + '">' +
      '<div class="task-top"><h3 class="task-title">' + escapeHtml(title) + '</h3>' + renderPill(st) + '</div>' +
      dateHtml +
      '<p class="task-summary">' + escapeHtml(task.summary || '') + '</p>' +
      statusLine + actionLine + linksHtml +
    '</div>';
  }

  function renderPerson(person, shared){
    var name = person.name || 'Unknown';
    var tasks = allTasks(person).map(function(task){
      task._status_norm = normStatus(task.status_type);
      return task;
    });
    var active = tasks.filter(function(task){ return task._status_norm !== 'merged'; })
      .sort(function(a, b){ return STATUS_PRIORITY[a._status_norm] - STATUS_PRIORITY[b._status_norm]; });
    var merged = tasks.filter(function(task){ return task._status_norm === 'merged'; });
    var counts = {};
    tasks.forEach(function(task){ counts[task._status_norm] = (counts[task._status_norm] || 0) + 1; });

    var countOrder = ['review', 'blocked', 'waiting', 'in_progress', 'merged'];
    var countText = countOrder.filter(function(key){ return counts[key]; })
      .map(function(key){ return counts[key] + ' ' + STATUS_COUNT_LABELS[key]; })
      .join(' &middot; ') || 'no tasks';
    var boardBadges = ['blocked', 'review', 'waiting', 'in_progress', 'merged']
      .filter(function(key){ return counts[key]; })
      .map(function(key){ return '<span>' + counts[key] + ' ' + STATUS_LABELS[key] + '</span>'; })
      .join('');
    var mergedHtml = '';
    if(merged.length){
      mergedHtml = '<details class="merged-group"><summary>' + merged.length + ' merged task' + (merged.length === 1 ? '' : 's') +
        '</summary><div class="merged-cards">' + merged.map(function(task){ return renderTask(task, name, shared); }).join('') + '</div></details>';
    }

    return '<section class="person-section" data-person="' + escapeHtml(name) + '">' +
      '<div class="rail"><div class="node"></div></div>' +
      '<div class="person-body"><h2 class="person-name">' + escapeHtml(name) + '</h2>' +
      '<p class="person-counts">' + countText + '</p>' +
      '<div class="board-status-summary">' + boardBadges + '</div>' +
      active.map(function(task){ return renderTask(task, name, shared); }).join('') + mergedHtml +
      '</div></section>';
  }

  function addChip(row, type, value, label, count){
    row.insertAdjacentHTML('beforeend', '<button class="chip" role="checkbox" aria-checked="false" data-filter-type="' +
      type + '" data-value="' + escapeHtml(value) + '">' + escapeHtml(label) + ' <span class="chip-count">' + count + '</span></button>');
  }

  function renderReport(){
    var data = JSON.parse(el('pr-summary-data').textContent);
    var people = data.people || [];
    var generated = data.generated_date || new Date().toLocaleDateString('en-US', {year: 'numeric', month: 'long', day: 'numeric'});
    var meta = 'Generated ' + generated + (data.period ? ' · Covering ' + data.period : '');
    var totalOpen = people.reduce(function(sum, person){ return sum + (person.open_tasks || []).length; }, 0);
    var totalClosed = people.reduce(function(sum, person){ return sum + (person.closed_tasks || []).length; }, 0);
    var shared = sharedPrMap(people);
    var statusCounts = {};
    var personCounts = {};

    document.title = data.title || 'Team PR & Task Summary';
    el('report-title').textContent = data.title || 'Team PR & Task Summary';
    el('meta-line').textContent = meta;
    el('footer-line').textContent = meta + ' · Single-file PR/task report';
    el('contributors-count').textContent = people.length;
    el('open-count').textContent = totalOpen;
    el('closed-count').textContent = totalClosed;
    el('sections').innerHTML = people.map(function(person){ return renderPerson(person, shared); }).join('');

    people.forEach(function(person){
      personCounts[person.name] = allTasks(person).length;
      allTasks(person).forEach(function(task){
        var st = normStatus(task.status_type);
        statusCounts[st] = (statusCounts[st] || 0) + 1;
      });
    });
    var statusRow = document.querySelector('[data-filter-group="status"]');
    ['review', 'blocked', 'waiting', 'in_progress', 'merged'].forEach(function(key){
      if(statusCounts[key]){ addChip(statusRow, 'status', key, STATUS_LABELS[key], statusCounts[key]); }
    });
    var personRow = document.querySelector('[data-filter-group="person"]');
    people.forEach(function(person){
      addChip(personRow, 'person', person.name, person.name, personCounts[person.name]);
    });
  }

  renderReport();

  var activeStatus = new Set(['all']);
  var activePerson = new Set(['all']);

  function toggleChip(chips, value, activeSet){
    if(value === 'all'){
      activeSet.clear();
      activeSet.add('all');
    } else {
      activeSet.delete('all');
      if(activeSet.has(value)){ activeSet.delete(value); }
      else { activeSet.add(value); }
      if(activeSet.size === 0){ activeSet.add('all'); }
    }
    chips.forEach(function(c){
      var v = c.getAttribute('data-value');
      var isActive = activeSet.has('all') ? v === 'all' : activeSet.has(v);
      c.classList.toggle('active', isActive);
      c.setAttribute('aria-checked', isActive ? 'true' : 'false');
    });
  }

  document.querySelectorAll('[data-filter-group]').forEach(function(row){
    var type = row.getAttribute('data-filter-group');
    var chips = row.querySelectorAll('.chip');
    var activeSet = type === 'status' ? activeStatus : activePerson;
    chips.forEach(function(chip){
      chip.addEventListener('click', function(){
        toggleChip(chips, chip.getAttribute('data-value'), activeSet);
        applyFilters();
      });
    });
  });

  var clearBtn = document.getElementById('clear-filters');
  clearBtn.addEventListener('click', function(){
    activeStatus.clear(); activeStatus.add('all');
    activePerson.clear(); activePerson.add('all');
    document.querySelectorAll('.chip[data-filter-type]').forEach(function(c){
      var isAll = c.getAttribute('data-value') === 'all';
      c.classList.toggle('active', isAll);
      c.setAttribute('aria-checked', isAll ? 'true' : 'false');
    });
    applyFilters();
  });

  function applyFilters(){
    var anyVisible = false;
    var visibleCount = 0;
    document.querySelectorAll('.person-section').forEach(function(section){
      var sectionHasVisible = false;
      var sectionPerson = section.getAttribute('data-person');
      var personMatch = activePerson.has('all') || activePerson.has(sectionPerson);
      section.querySelectorAll('.task-card').forEach(function(card){
        var statusMatch = activeStatus.has('all') || activeStatus.has(card.getAttribute('data-status'));
        var visible = personMatch && statusMatch;
        card.classList.toggle('is-hidden', !visible);
        if(visible){ sectionHasVisible = true; anyVisible = true; visibleCount++; }
      });
      section.classList.toggle('is-hidden', !sectionHasVisible);
    });
    document.getElementById('empty-state').style.display = anyVisible ? 'none' : 'block';
    document.getElementById('result-count').textContent = visibleCount + ' task' + (visibleCount === 1 ? '' : 's') + ' shown';

    var filtersActive = !activeStatus.has('all') || !activePerson.has('all');
    clearBtn.classList.toggle('visible', filtersActive);
  }
  applyFilters();

  var viewLinear = document.getElementById('view-linear');
  var viewBoard = document.getElementById('view-board');
  function setView(mode, updateUrl){
    document.body.classList.toggle('mode-board', mode === 'board');
    viewLinear.classList.toggle('active', mode !== 'board');
    viewBoard.classList.toggle('active', mode === 'board');
    viewLinear.setAttribute('aria-pressed', mode !== 'board');
    viewBoard.setAttribute('aria-pressed', mode === 'board');
    if(updateUrl){
      try{
        var url = new URL(window.location.href);
        if(mode === 'board'){ url.searchParams.set('view', 'board'); }
        else{ url.searchParams.delete('view'); }
        window.history.replaceState({}, '', url);
      }catch(e){
        // Some sandboxed preview contexts (e.g. srcdoc iframes) block history
        // updates entirely - view toggling still works, it just won't persist
        // across a reload in that context. Safe to ignore.
      }
    }
  }
  viewLinear.addEventListener('click', function(){ setView('linear', true); });
  viewBoard.addEventListener('click', function(){ setView('board', true); });
  var initialView = null;
  try{
    initialView = new URL(window.location.href).searchParams.get('view');
  }catch(e){ /* ignore in sandboxed contexts */ }
  if(initialView === 'board'){ setView('board', false); }
})();
</script>
</body>
</html>
