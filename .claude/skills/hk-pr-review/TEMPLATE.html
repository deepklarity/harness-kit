<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>PR Review</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  /* Colour tokens carried over from harness-kit mission control. Light is the
     default, dark follows the OS, and data-theme beats both.
     The f1-f5 ramp carries both scales. Severity runs 5 worst to 1 harmless,
     readiness runs 1 worst to 5 ready. The numbers point opposite ways, so the
     colour is what stays honest: red is bad on both, green is fine on both. */
  :root {
    --bg:#ffffff; --bg-2:#f7f8fa;
    --line:#e4e6ea; --line-strong:#cfd3da;
    --ink:#16181d; --ink-2:#4b5160; --ink-3:#9aa0ad; --mono-ink:#6d7484;
    --accent:#1d4ed8; --accent-soft:#eff4ff;
    --low:#b3392f; --low-soft:#fdf1f0;
    --mid:#a36a1c; --mid-soft:#fdf6ea;
    --high:#1f7a4d;
    --f1:#b3392f; --f1-soft:#fdf1f0;
    --f2:#c2612a; --f2-soft:#fdf0e8;
    --f3:#a36a1c; --f3-soft:#fdf6ea;
    --f4:#4a8a52; --f4-soft:#f0f7ee;
    --f5:#1f7a4d; --f5-soft:#edf7f1;
    --shadow:rgba(28,25,23,0.12);
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --mono:ui-monospace,"SF Mono","JetBrains Mono",Menlo,Consolas,monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg:#14161b; --bg-2:#1b1e25;
      --line:#2a2e37; --line-strong:#3a3f4b;
      --ink:#e8e9ec; --ink-2:#aeb3bf; --ink-3:#666c79; --mono-ink:#868d9c;
      --accent:#7da2ff; --accent-soft:#1c2536;
      --low:#e07a6e; --low-soft:#2c1e1c;
      --mid:#d9a441; --mid-soft:#2a2418;
      --high:#6fbf8f;
      --f1:#e07a6e; --f1-soft:#2c1e1c;
      --f2:#dc8f5f; --f2-soft:#2e2119;
      --f3:#d9a441; --f3-soft:#2a2418;
      --f4:#8fc48f; --f4-soft:#1e2b1f;
      --f5:#6fbf8f; --f5-soft:#1a2b22;
      --shadow:rgba(0,0,0,0.5);
    }
  }
  :root[data-theme="dark"] {
    --bg:#14161b; --bg-2:#1b1e25;
    --line:#2a2e37; --line-strong:#3a3f4b;
    --ink:#e8e9ec; --ink-2:#aeb3bf; --ink-3:#666c79; --mono-ink:#868d9c;
    --accent:#7da2ff; --accent-soft:#1c2536;
    --low:#e07a6e; --low-soft:#2c1e1c;
    --mid:#d9a441; --mid-soft:#2a2418;
    --high:#6fbf8f;
    --f1:#e07a6e; --f1-soft:#2c1e1c;
    --f2:#dc8f5f; --f2-soft:#2e2119;
    --f3:#d9a441; --f3-soft:#2a2418;
    --f4:#8fc48f; --f4-soft:#1e2b1f;
    --f5:#6fbf8f; --f5-soft:#1a2b22;
    --shadow:rgba(0,0,0,0.5);
  }
  :root[data-theme="light"] {
    --bg:#ffffff; --bg-2:#f7f8fa;
    --line:#e4e6ea; --line-strong:#cfd3da;
    --ink:#16181d; --ink-2:#4b5160; --ink-3:#9aa0ad; --mono-ink:#6d7484;
    --accent:#1d4ed8; --accent-soft:#eff4ff;
    --low:#b3392f; --low-soft:#fdf1f0;
    --mid:#a36a1c; --mid-soft:#fdf6ea;
    --high:#1f7a4d;
    --f1:#b3392f; --f1-soft:#fdf1f0;
    --f2:#c2612a; --f2-soft:#fdf0e8;
    --f3:#a36a1c; --f3-soft:#fdf6ea;
    --f4:#4a8a52; --f4-soft:#f0f7ee;
    --f5:#1f7a4d; --f5-soft:#edf7f1;
    --shadow:rgba(28,25,23,0.12);
  }

  * { box-sizing: border-box; }
  /* Ground and ink move together or a host shell leaves the page unreadable. */
  html, body {
    margin: 0;
    background: var(--bg) !important;
    color: var(--ink) !important;
    font: 15px/1.55 var(--sans);
    -webkit-font-smoothing: antialiased;
  }
  button, input, textarea { font-family: inherit; font-size: inherit; color: inherit; }

  /* One column. The two sibling skills have a rail because you pick a flow from
     it. Here there is nothing to pick, so a rail would only list the findings a
     second time next to the list that already shows them. */
  .page { max-width: 54rem; margin: 0 auto; padding: 40px 24px 80px; }

  /* ---- hero: the whole answer, before anything else ---- */
  .hero { margin-bottom: 44px; }
  .score-row { display: flex; align-items: center; gap: 20px; margin-bottom: 22px; }
  .score {
    flex: 0 0 auto; display: flex; align-items: baseline; gap: 6px;
    font-family: var(--mono); font-variant-numeric: tabular-nums; color: var(--ink-3);
  }
  .score .n { font-size: 76px; line-height: 0.9; letter-spacing: -0.03em; }
  .score .of { font-size: 13px; }
  .score[data-r="5"] .n { color: var(--f5); }
  .score[data-r="4"] .n { color: var(--f4); }
  .score[data-r="3"] .n { color: var(--f3); }
  .score[data-r="2"] .n { color: var(--f2); }
  .score[data-r="1"] .n { color: var(--f1); }
  .score-say { min-width: 0; }
  .score-say .word {
    font-size: 21px; font-weight: 600; letter-spacing: -0.01em; margin-bottom: 3px;
  }
  .score-say .why { color: var(--ink-2); font-size: 14.5px; }

  /* One card per pull request, each with its own score, so you can see which
     repo is holding the change back. */
  .prs { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 22px; }
  .prcard {
    display: flex; align-items: center; gap: 10px; text-decoration: none; color: inherit;
    background: var(--bg-2); border: 1px solid var(--line-strong);
    border-left: 3px solid var(--ink-3); border-radius: 7px; padding: 9px 13px;
    transition: border-color 120ms ease;
  }
  .prcard:hover { border-color: var(--accent); }
  .prcard[data-r="5"] { border-left-color: var(--f5); }
  .prcard[data-r="4"] { border-left-color: var(--f4); }
  .prcard[data-r="3"] { border-left-color: var(--f3); }
  .prcard[data-r="2"] { border-left-color: var(--f2); }
  .prcard[data-r="1"] { border-left-color: var(--f1); }
  .prcard .pn {
    font-family: var(--mono); font-size: 22px; line-height: 1; color: var(--ink-3);
    font-variant-numeric: tabular-nums;
  }
  .prcard[data-r="5"] .pn { color: var(--f5); }
  .prcard[data-r="4"] .pn { color: var(--f4); }
  .prcard[data-r="3"] .pn { color: var(--f3); }
  .prcard[data-r="2"] .pn { color: var(--f2); }
  .prcard[data-r="1"] .pn { color: var(--f1); }
  .prcard .pmeta { min-width: 0; display: flex; flex-direction: column; }
  .prcard .pname { font-size: 13px; font-weight: 600; }
  .prcard .pstat {
    font-family: var(--mono); font-size: 10.5px; color: var(--mono-ink); margin-top: 2px;
    font-variant-numeric: tabular-nums;
  }

  /* Six things decide whether a change can go in. The big number is their mean,
     so it can be checked against these by eye. The weakest one is named under
     them, because an average says how good the work is and not what to fix. */
  .dims { display: flex; flex-direction: column; gap: 6px; }
  .dim { display: flex; align-items: baseline; gap: 11px; font-size: 13px; }
  .dim .dl {
    flex: 0 0 88px; font-size: 10px; letter-spacing: 0.07em;
    text-transform: uppercase; color: var(--ink-3);
  }
  .meter { flex: 0 0 auto; display: flex; gap: 2px; }
  .meter i { display: block; width: 14px; height: 6px; border-radius: 2px; background: var(--line); }
  .meter i.on { background: var(--ink-3); }
  .dim[data-r="5"] .meter i.on { background: var(--f5); }
  .dim[data-r="4"] .meter i.on { background: var(--f4); }
  .dim[data-r="3"] .meter i.on { background: var(--f3); }
  .dim[data-r="2"] .meter i.on { background: var(--f2); }
  .dim[data-r="1"] .meter i.on { background: var(--f1); }
  .dim .dw { color: var(--ink-3); min-width: 0; }
  /* The dimension that set the overall reads at full strength. The number alone
     does not tell you what to go fix. */
  .dim.weakest .dw { color: var(--ink); }
  .dim.weakest .dl { color: var(--ink-2); font-weight: 600; }
  .fix-first {
    margin-top: 12px; padding-left: 99px; font-size: 12px; color: var(--ink-2);
  }
  @media (max-width: 640px) { .fix-first { padding-left: 0; } }

  /* ---- sections ---- */
  section { margin-bottom: 44px; }
  section > h2 {
    margin: 0 0 14px; font-size: 12px; letter-spacing: 0.09em;
    text-transform: uppercase; color: var(--ink-3);
    border-bottom: 1px solid var(--line); padding-bottom: 7px;
  }
  section > h2 .count { color: var(--ink-3); font-weight: 400; }
  .lede { margin: 0 0 16px; color: var(--ink-2); }

  /* ---- findings: one line each, depth lives in the drawer ---- */
  .find {
    display: flex; align-items: baseline; gap: 10px; width: 100%; text-align: left;
    background: none; border: none; border-left: 3px solid var(--ink-3);
    padding: 9px 11px; margin-bottom: 2px; cursor: pointer; border-radius: 0 5px 5px 0;
    transition: background 120ms ease;
  }
  .find:hover { background: var(--bg-2); }
  .find.open { background: var(--accent-soft); }
  .find[data-sev="5"] { border-left-color: var(--f1); }
  .find[data-sev="4"] { border-left-color: var(--f2); }
  .find[data-sev="3"] { border-left-color: var(--f3); }
  .find[data-sev="2"] { border-left-color: var(--f4); }
  .find[data-sev="1"] { border-left-color: var(--f5); }
  .find .sev {
    flex: 0 0 auto; font-family: var(--mono); font-size: 10px; color: #fff;
    background: var(--ink-3); border-radius: 9px; padding: 1px 6px;
    font-variant-numeric: tabular-nums;
  }
  .find[data-sev="5"] .sev { background: var(--f1); }
  .find[data-sev="4"] .sev { background: var(--f2); }
  .find[data-sev="3"] .sev { background: var(--f3); }
  .find[data-sev="2"] .sev { background: var(--f4); }
  .find[data-sev="1"] .sev { background: var(--f5); }
  .find .ft { flex: 1 1 auto; font-size: 14px; min-width: 0; }
  .find .fw {
    flex: 0 0 auto; font-family: var(--mono); font-size: 10.5px; color: var(--mono-ink);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 40%;
  }
  .find.noted .ft::after {
    content: ""; display: inline-block; width: 6px; height: 6px; border-radius: 50%;
    background: var(--high); margin-left: 6px; vertical-align: 1px;
  }
  @media (max-width: 640px) { .find { flex-wrap: wrap; } .find .fw { max-width: 100%; } }

  /* ---- what a group of findings means for merging ---- */
  .grp {
    display: flex; align-items: baseline; gap: 9px; flex-wrap: wrap;
    margin: 18px 0 7px; padding-bottom: 5px; border-bottom: 1px solid var(--line);
  }
  .grp:first-child { margin-top: 0; }
  .grp .gn {
    font-family: var(--mono); font-size: 10px; letter-spacing: .07em;
    text-transform: uppercase; color: #fff; background: var(--ink-3);
    border-radius: 9px; padding: 2px 8px;
  }
  .grp[data-g="block"] .gn { background: var(--f2); }
  .grp[data-g="major"] .gn { background: var(--f3); }
  .grp[data-g="minor"] .gn { background: var(--f4); }
  .grp .gw { font-size: 12.5px; color: var(--ink-2); flex: 1 1 auto; min-width: 0; }
  .grp .gc { font-family: var(--mono); font-size: 11px; color: var(--ink-3); }

  .empty {
    background: var(--bg-2); border: 1px solid var(--line); border-radius: 7px;
    padding: 16px 18px; color: var(--ink-2);
  }

  /* ---- what changed ---- */
  .chg { display: flex; gap: 10px; padding: 7px 0; border-bottom: 1px solid var(--line); }
  .chg:last-child { border-bottom: none; }
  .chg .ca { flex: 0 0 130px; font-size: 13px; font-weight: 600; }
  .chg .cw { flex: 1 1 auto; font-size: 13.5px; color: var(--ink-2); min-width: 0; }
  .chg .cr {
    flex: 0 0 auto; font-family: var(--mono); font-size: 10px; color: var(--mono-ink);
  }
  @media (max-width: 640px) { .chg { flex-wrap: wrap; } .chg .ca { flex-basis: 100%; } }

  .note-line {
    margin-top: 14px; background: var(--mid-soft); border-left: 3px solid var(--mid);
    border-radius: 0 5px 5px 0; padding: 10px 13px; font-size: 13.5px;
  }

  /* ---- how to test: down here, and folded ---- */
  details { border-bottom: 1px solid var(--line); }
  details:last-of-type { border-bottom: none; }
  summary {
    cursor: pointer; padding: 9px 0; font-size: 14px; list-style: none;
    display: flex; gap: 10px; align-items: baseline;
  }
  summary::-webkit-details-marker { display: none; }
  summary::before {
    content: "+"; font-family: var(--mono); color: var(--ink-3); flex: 0 0 auto;
  }
  details[open] > summary::before { content: "−"; }
  summary .sn {
    flex: 0 0 auto; font-family: var(--mono); font-size: 11px; color: var(--ink-3);
    font-variant-numeric: tabular-nums;
  }
  .dbody { padding: 0 0 12px 20px; }
  .dbody .lbl {
    font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase;
    color: var(--ink-3); margin-bottom: 3px;
  }
  .dbody .expect { color: var(--ink-2); font-size: 13.5px; }
  .dbody .where {
    font-family: var(--mono); font-size: 11px; color: var(--mono-ink); margin-top: 6px;
    overflow-wrap: anywhere;
  }
  .cmd {
    display: flex; gap: 8px; align-items: center; margin-bottom: 5px;
  }
  .cmd code {
    flex: 1 1 auto; font-family: var(--mono); font-size: 11.5px; color: var(--ink-2);
    background: var(--bg-2); border: 1px solid var(--line); border-radius: 5px;
    padding: 6px 9px; overflow-wrap: anywhere;
  }
  .covers { margin-top: 8px; }
  .covers button {
    font-size: 11px; cursor: pointer; background: none; border: none; padding: 0;
    color: var(--accent); text-decoration: underline;
  }

  .btn {
    background: var(--bg); border: 1px solid var(--line-strong);
    border-radius: 5px; padding: 4px 9px; cursor: pointer; font-size: 11.5px;
  }
  .btn:hover { border-color: var(--accent); color: var(--accent); }
  .btn[disabled] { opacity: 0.45; cursor: default; }
  .btn[disabled]:hover { border-color: var(--line-strong); color: inherit; }

  /* ---- foot ---- */
  .foot {
    border-top: 1px solid var(--line); padding-top: 16px; margin-top: 44px;
    display: flex; gap: 14px; align-items: flex-start; flex-wrap: wrap;
    font-size: 11.5px; color: var(--ink-3); line-height: 1.5;
  }
  .foot .said { flex: 1 1 300px; min-width: 0; }

  /* Anything read out of the code stays bare. Anything worked out says so. */
  .amark {
    display: inline-block; font-family: var(--mono); font-size: 9px;
    letter-spacing: 0.05em; text-transform: uppercase; color: var(--mid);
    background: var(--mid-soft); border: 1px solid var(--mid);
    border-radius: 3px; padding: 0 4px; margin-right: 4px; vertical-align: 1px;
  }

  /* ---- drawer: headline, short version, why, the line, the fix, the facts ---- */
  .panel {
    position: fixed; top: 0; right: 0; bottom: 0; width: 420px; max-width: 100%; z-index: 20;
    background: var(--bg-2); border-left: 1px solid var(--line-strong);
    overflow-y: auto; padding: 22px 24px 40px;
    transform: translateX(100%); transition: transform 180ms ease;
    box-shadow: -8px 0 24px var(--shadow);
  }
  .panel.open { transform: translateX(0); }
  .panel .pclose {
    float: right; background: none; border: none; cursor: pointer;
    color: var(--ink-3); font-size: 16px; line-height: 1; padding: 2px 4px;
  }
  .panel .pclose:hover { color: var(--accent); }
  .panel .pnum {
    display: inline-block; font-family: var(--mono); font-size: 10px; color: #fff;
    background: var(--ink-3); border-radius: 9px; padding: 1px 7px; margin-bottom: 9px;
    font-variant-numeric: tabular-nums;
  }
  .panel[data-sev="5"] .pnum { background: var(--f1); }
  .panel[data-sev="4"] .pnum { background: var(--f2); }
  .panel[data-sev="3"] .pnum { background: var(--f3); }
  .panel[data-sev="2"] .pnum { background: var(--f4); }
  .panel[data-sev="1"] .pnum { background: var(--f5); }
  .panel h3 { margin: 0 0 13px; font-size: 17px; line-height: 1.3; letter-spacing: -0.01em; }
  .panel .tldr {
    background: var(--bg); border: 1px solid var(--line); border-left: 3px solid var(--ink-3);
    border-radius: 6px; padding: 11px 13px; font-size: 14px; line-height: 1.5;
  }
  .panel[data-sev="5"] .tldr { border-left-color: var(--f1); }
  .panel[data-sev="4"] .tldr { border-left-color: var(--f2); }
  .panel[data-sev="3"] .tldr { border-left-color: var(--f3); }
  .panel[data-sev="2"] .tldr { border-left-color: var(--f4); }
  .panel[data-sev="1"] .tldr { border-left-color: var(--f5); }
  .panel h4 {
    margin: 18px 0 7px; font-size: 10px; letter-spacing: 0.08em;
    text-transform: uppercase; color: var(--ink-3);
  }
  .panel p { margin: 0; color: var(--ink-2); font-size: 13.5px; line-height: 1.55; }
  /* The line as it actually reads in the file, so the finding is checkable. */
  .panel .evidence {
    font-family: var(--mono); font-size: 11.5px; color: var(--ink-2);
    background: var(--bg); border: 1px solid var(--line); border-radius: 5px;
    padding: 8px 9px; white-space: pre-wrap; overflow-wrap: anywhere; margin: 0;
  }
  /* The action reads in the accent, never in the severity, so it never blends
     into the problem it is fixing. */
  .panel .fix {
    background: var(--bg); border: 1px solid var(--line); border-left: 3px solid var(--accent);
    border-radius: 6px; padding: 11px 13px; font-size: 13.5px; line-height: 1.5; color: var(--ink);
  }
  .panel .tablewrap { overflow-x: auto; }
  .panel table { width: 100%; border-collapse: collapse; font-size: 12px; }
  .panel td { padding: 6px 0; border-bottom: 1px solid var(--line); vertical-align: top; }
  .panel td:first-child {
    color: var(--ink-3); width: 38%; padding-right: 10px;
    font-size: 10px; letter-spacing: 0.06em; text-transform: uppercase; padding-top: 8px;
  }
  .panel td:last-child {
    font-family: var(--mono); color: var(--ink-2); overflow-wrap: anywhere;
    font-variant-numeric: tabular-nums;
  }
  .panel .note-box {
    width: 100%; min-height: 62px; background: var(--bg); color: inherit;
    border: 1px solid var(--line-strong); border-radius: 6px; padding: 8px;
    resize: vertical; font-size: 13px; line-height: 1.5;
  }
  .panel .note-box:focus { outline: none; border-color: var(--accent); }
  .panel .saved {
    font-family: var(--mono); font-size: 9.5px; color: var(--high);
    opacity: 0; transition: opacity 150ms ease; margin-left: 8px;
  }
  .panel .saved.on { opacity: 1; }
  .panel .pathrow { display: flex; gap: 8px; align-items: center; margin-top: 12px; }
  .panel .pathrow code {
    flex: 1 1 auto; font-family: var(--mono); font-size: 11px; color: var(--ink-2);
    background: var(--bg); border: 1px solid var(--line); border-radius: 5px;
    padding: 6px 8px; overflow-wrap: anywhere;
  }
  .panel .nav { display: flex; gap: 7px; margin-top: 20px; }

  .toast {
    position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%);
    background: var(--ink); color: var(--bg); padding: 7px 13px; border-radius: 6px;
    font-size: 12px; opacity: 0; transition: opacity 180ms ease; pointer-events: none; z-index: 30;
  }
  .toast.show { opacity: 1; }
</style>
</head>
<body>
<div class="page">
  <header class="hero">
    <div class="score-row">
      <div class="score" id="score"><span class="n"></span><span class="of">of 5</span></div>
      <div class="score-say">
        <div class="word" id="score-word"></div>
        <div class="why" id="score-why"></div>
      </div>
    </div>
    <div class="prs" id="prs"></div>
    <div class="dims" id="dims"></div>
    <div class="fix-first" id="fix-first"></div>
  </header>

  <section id="sec-findings">
    <h2>What is wrong <span class="count" id="find-count"></span></h2>
    <div id="finds"></div>
  </section>

  <section id="sec-what">
    <h2>What changed</h2>
    <p class="lede" id="what-body"></p>
    <div id="changes"></div>
    <div id="what-note"></div>
  </section>

  <section id="sec-test">
    <h2>How to test</h2>
    <div id="test"></div>
  </section>

  <div class="foot">
    <div class="said" id="foot-said"></div>
    <button class="btn" id="theme">Theme</button>
  </div>
</div>

<aside class="panel" id="panel"></aside>
<div class="toast" id="toast"></div>

<script type="application/json" id="review-data">
{
  "product": "example",
  "reviewed": "Read by hand from the merge-base diff. Nothing was run. Line numbers drift.",
  "readiness": {
    "score": 4.4,
    "why": "One save path drops its errors. Fix that and it goes in.",
    "dimensions": [
      {
        "id": "correctness",
        "label": "Correctness",
        "score": 3,
        "why": "One unawaited save on the edit path."
      },
      {
        "id": "scope",
        "label": "Scope",
        "score": 5,
        "why": "Everything here belongs."
      },
      {
        "id": "migrations",
        "label": "Migrations",
        "score": null,
        "why": "No schema change."
      },
      {
        "id": "conventions",
        "label": "Conventions",
        "score": 5,
        "why": "Follows the files around it."
      },
      {
        "id": "tests",
        "label": "Tests",
        "score": 5,
        "why": "The existing spec covers the change."
      },
      {
        "id": "clarity",
        "label": "Clarity",
        "score": 5,
        "why": "Small diff, reads straight through."
      }
    ]
  },
  "prs": [
    {
      "number": 1,
      "title": "An example pull request",
      "url": "https://github.com/owner/example-repo/pull/1",
      "repo": "owner/example-repo",
      "author": "someone",
      "base": "main",
      "head": "feat/example",
      "merge_base": "0000000",
      "state": "open",
      "draft": false,
      "files_changed": 2,
      "added": 40,
      "removed": 6,
      "checks": "passing",
      "readiness": {
        "score": 4.4,
        "why": "One save path drops its errors."
      }
    }
  ],
  "summary": {
    "headline": "An example change.",
    "body": "Replace this block with a generated review. The page renders on its own so you can look at it first.",
    "changes": [
      {
        "id": "example-change",
        "area": "Example area",
        "repo": "owner/example-repo",
        "what": "One sentence saying what changed here.",
        "files": [
          "src/example.ts"
        ]
      }
    ]
  },
  "testing": {
    "setup": [
      {
        "repo": "owner/example-repo",
        "cmd": "npm install"
      },
      {
        "repo": "owner/example-repo",
        "cmd": "npm run dev"
      }
    ],
    "steps": [
      {
        "id": "example-step",
        "n": 1,
        "do": "Change a value, then click away.",
        "expect": "It saves and survives a reload.",
        "where": "http://localhost:3000/",
        "covers": [
          "example-finding"
        ]
      }
    ],
    "automated": "Three tests exist. None touch the changed branch."
  },
  "findings": [
    {
      "id": "example-finding",
      "rank": 1,
      "sev": 4,
      "kind": "bug",
      "confidence": "traced",
      "repo": "owner/example-repo",
      "title": "A failed save looks like it worked",
      "file": "src/example.ts",
      "line": 12,
      "lines": "12-16",
      "fn": "handleBlur",
      "evidence": "    save(row.uid, payload);",
      "what": "handleBlur calls save with no await and no catch.",
      "why": "The function returns before the request finishes, so a rejected promise goes nowhere. [Assumption] Someone on an expired token sees the new value and loses it on reload.",
      "fix": "Await the call and show the toast that already exists on failure.",
      "in_diff": true,
      "callers": 1,
      "raised_already": false
    },
    {
      "id": "example-nit",
      "rank": 2,
      "sev": 1,
      "kind": "slop",
      "confidence": "traced",
      "repo": "owner/example-repo",
      "title": "A debug print is left behind",
      "file": "src/example.ts",
      "line": 20,
      "lines": "20",
      "fn": "handleBlur",
      "evidence": "    console.log('here');",
      "what": "There is a console.log on line 20 that this change added.",
      "why": "It prints on every blur. Nothing reads it.",
      "fix": "Delete the line.",
      "in_diff": true,
      "callers": 0,
      "raised_already": false
    }
  ],
  "checked": {
    "raised": 9,
    "kept": 2,
    "dropped": 7
  }
}
</script>

<script>
(function () {
  "use strict";

  const el = id => document.getElementById(id);

  const SEV_WORDS = {
    5: "ships broken or unsafe",
    4: "wrong for a real case",
    3: "real problem, small blast radius",
    2: "friction, not a defect",
    1: "nit",
  };
  // Severity says how bad one finding is. This says what it means for merging,
  // which is the question people actually open the page with. Derived from sev
  // and never stored, so the two cannot drift apart.
  function group(sev) {
    if (sev >= 4) return { id: "block", name: "Blockers", what: "Fix these before this merges." };
    if (sev === 3) return { id: "major", name: "Major", what: "Real problems. Fix them, here or in a follow-up you have already agreed." };
    return { id: "minor", name: "Minor", what: "Friction and nits. Merging over them is fine." };
  }

  // The overall is the average of the dimensions, so it lands between whole
  // numbers. Bands, not a lookup.
  function readyWord(n) {
    if (n == null) return "";
    if (n >= 4.5) return "Ready";
    if (n >= 3.5) return "Close";
    if (n >= 2.5) return "Needs another pass";
    if (n >= 1.5) return "A lot to fix";
    return "Do not merge";
  }

  let data = JSON.parse(el("review-data").textContent);
  let byId = new Map();
  let openId = null;
  let notesKey = "pr-review:default";
  let notes = {}, noteTimer = null;

  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, c =>
      ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  }

  // Prose that may carry the [Assumption] marker. The marker becomes a tag so
  // the sentence still reads, and the reader is never left guessing which
  // claims came out of the code and which are a reading of it. Escape first,
  // then swap, or a finding could inject markup.
  function prose(s) {
    return esc(s).replace(/\[Assumption\]\s*/g, '<span class="amark">assumption</span>');
  }

  function findings() { return data.findings || []; }
  function prs() { return data.prs || (data.pr ? [data.pr] : []); }
  function path(f) { return (f.file || "") + (f.line ? ":" + f.line : ""); }
  function shortRepo(r) { return String(r || "").split("/").pop(); }
  // Only name the repo when the review covers more than one, or it is noise.
  function multi() { return prs().length > 1; }

  // Notes are keyed by the finding's stable id, never by rank or position,
  // which shift the moment a finding is added or one gets fixed.
  function loadNotes() {
    try { return JSON.parse(localStorage.getItem(notesKey)) || {}; } catch (_) { return {}; }
  }
  function scheduleNoteSave(id, value, flash) {
    if (value) notes[id] = value; else delete notes[id];
    clearTimeout(noteTimer);
    noteTimer = setTimeout(() => {
      try { localStorage.setItem(notesKey, JSON.stringify(notes)); } catch (_) {}
      if (flash) { flash.classList.add("on"); setTimeout(() => flash.classList.remove("on"), 1100); }
      renderFinds();
    }, 350);
  }

  function toast(msg) {
    const t = el("toast");
    t.textContent = msg;
    t.classList.add("show");
    clearTimeout(t._timer);
    t._timer = setTimeout(() => t.classList.remove("show"), 1400);
  }
  function copyBtn(text) {
    return () => navigator.clipboard.writeText(text)
      .then(() => toast("Copied " + text), () => toast(text));
  }

  function ingest(d) {
    data = d;
    byId = new Map(findings().map(f => [f.id, f]));
    // One change can arrive as several PRs, so the notes key is the whole set.
    notesKey = "pr-review:" + prs().map(p => (p.repo || "") + "#" + (p.number || "")).sort().join("+");
    notes = loadNotes();
    openId = null;
    document.title = (prs().length
      ? prs().map(p => shortRepo(p.repo) + " #" + p.number).join(" + ")
      : (d.product || "PR")) + " — PR Review";

    renderHero();
    renderFinds();
    renderWhat();
    renderTest();
    el("foot-said").textContent = d.reviewed || "";
    closePanel();
  }

  function meter(score) {
    return '<span class="meter">' +
      [1, 2, 3, 4, 5].map(i => '<i class="' + (score != null && i <= score ? "on" : "") + '"></i>').join("") +
      "</span>";
  }

  function renderHero() {
    const r = data.readiness || {};
    const s = el("score");
    // Always one decimal. It is the average of the six meters below, so a
    // reader can check the headline against them by eye.
    s.querySelector(".n").textContent = r.score != null ? Number(r.score).toFixed(1) : "—";
    if (r.score != null) s.dataset.r = Math.round(r.score); else delete s.dataset.r;
    el("score-word").textContent = readyWord(r.score);
    el("score-why").innerHTML = prose(r.why || "");

    el("prs").innerHTML = prs().map(p => {
      const ps = (p.readiness || {}).score;
      const bits = [];
      if (p.files_changed != null) bits.push(p.files_changed + " files");
      if (p.added != null) bits.push("+" + p.added);
      if (p.removed != null) bits.push("−" + p.removed);
      if (p.checks === "failing") bits.push("checks failing");
      if (p.draft) bits.push("draft");
      // The attribute carries the rounded score because the colour rules are
      // whole numbers. The text keeps the decimal.
      return '<a class="prcard"' + (ps != null ? ' data-r="' + Math.round(ps) + '"' : "") +
        ' href="' + esc(p.url || "#") + '">' +
        '<span class="pn">' + esc(ps != null ? Number(ps).toFixed(1) : "—") + "</span>" +
        '<span class="pmeta">' +
          '<span class="pname">' + esc(shortRepo(p.repo)) + " #" + esc(p.number) + "</span>" +
          '<span class="pstat">' + esc(bits.join("  ")) + "</span>" +
        "</span></a>";
    }).join("");

    // The overall is the average, so the weakest dimension no longer sets it.
    // It still gets marked and named, because an average tells you how the work
    // reads overall and not what to go and fix.
    const dims = (r.dimensions || []);
    const live = dims.filter(d => d.score != null);
    const low = live.length ? Math.min.apply(null, live.map(d => d.score)) : null;
    const worst = live.filter(d => d.score === low).map(d => (d.label || d.id || "").toLowerCase());
    el("fix-first").textContent = worst.length ? "Fix first: " + worst.join(", ") : "";
    el("dims").innerHTML = dims.map(d => {
      const na = d.score == null;
      return '<div class="dim' + (!na && d.score === low ? " weakest" : "") + '"' +
             (na ? "" : ' data-r="' + esc(d.score) + '"') + ">" +
        '<span class="dl">' + esc(d.label || d.id || "") + "</span>" +
        meter(d.score) +
        '<span class="dw">' + (na ? "not in this change. " : "") + prose(d.why || "") + "</span>" +
      "</div>";
    }).join("");
  }

  function renderFinds() {
    const list = findings();
    // The headline count is the one that decides whether this can go in, so
    // lead with the blockers rather than the total.
    el("find-count").textContent = list.length
      ? ["block", "major", "minor"]
          .map(id => [id, list.filter(f => group(f.sev).id === id).length])
          .filter(p => p[1])
          .map(p => p[1] + " " + { block: "blocker", major: "major", minor: "minor" }[p[0]] +
                    (p[0] === "block" && p[1] > 1 ? "s" : ""))
          .join(", ")
      : "";
    const box = el("finds");
    box.innerHTML = "";
    if (!list.length) {
      const c = data.checked || {};
      box.innerHTML = '<div class="empty">Nothing to raise.' +
        (c.raised != null ? " We looked at " + esc(c.raised) + " things and none held up." : "") + "</div>";
      return;
    }
    // The order in the file is the order the reviewer decided on. Never re-sort.
    // Groups only insert a heading when the band changes, so a list that is
    // already ranked by severity gets its headings in the right places and a
    // finding never moves.
    let band = null;
    list.forEach(f => {
      const g = group(f.sev);
      if (g.id !== band) {
        band = g.id;
        const n = list.filter(x => group(x.sev).id === g.id).length;
        const h = document.createElement("div");
        h.className = "grp";
        h.dataset.g = g.id;
        h.innerHTML = '<span class="gn">' + esc(g.name) + "</span>" +
          '<span class="gw">' + esc(g.what) + "</span>" +
          '<span class="gc">' + n + "</span>";
        box.appendChild(h);
      }
      const b = document.createElement("button");
      b.className = "find" + (openId === f.id ? " open" : "") + (notes[f.id] ? " noted" : "");
      b.dataset.sev = f.sev;
      b.dataset.id = f.id;
      b.innerHTML =
        '<span class="sev">' + esc(f.sev) + "</span>" +
        '<span class="ft">' + esc(f.title || "") + "</span>" +
        '<span class="fw">' + (multi() && f.repo ? esc(shortRepo(f.repo)) + "  " : "") +
          esc(path(f)) + "</span>";
      b.addEventListener("click", () => openFinding(f.id));
      box.appendChild(b);
    });
  }

  function renderWhat() {
    const s = data.summary || {};
    el("what-body").innerHTML = prose(s.body || "");
    el("changes").innerHTML = (s.changes || []).map(c =>
      '<div class="chg">' +
        '<span class="ca">' + esc(c.area || "") + "</span>" +
        '<span class="cw">' + prose(c.what || "") + "</span>" +
        (multi() && c.repo ? '<span class="cr">' + esc(shortRepo(c.repo)) + "</span>" : "") +
      "</div>").join("");
    el("what-note").innerHTML = s.out_of_scope
      ? '<div class="note-line">' + prose(s.out_of_scope) + "</div>" : "";
  }

  function renderTest() {
    const t = data.testing || {};
    const box = el("test");
    box.innerHTML = "";

    if ((t.setup || []).length) {
      const d = document.createElement("details");
      d.innerHTML = "<summary>Get it running</summary><div class='dbody'></div>";
      const body = d.querySelector(".dbody");
      t.setup.forEach(item => {
        const cmd = typeof item === "string" ? item : item.cmd;
        const repo = typeof item === "string" ? "" : item.repo;
        const row = document.createElement("div");
        row.className = "cmd";
        row.innerHTML = "<code>" + (multi() && repo ? esc(shortRepo(repo)) + ": " : "") +
          esc(cmd) + '</code><button class="btn">Copy</button>';
        row.querySelector("button").addEventListener("click", copyBtn(cmd));
        body.appendChild(row);
      });
      box.appendChild(d);
    }

    (t.steps || []).forEach((st, i) => {
      const d = document.createElement("details");
      d.innerHTML =
        "<summary><span class='sn'>" + esc(st.n != null ? st.n : i + 1) + "</span>" +
          "<span>" + prose(st.do || "") + "</span></summary>" +
        "<div class='dbody'>" +
          (st.expect ? "<div class='lbl'>You should see</div><div class='expect'>" +
            prose(st.expect) + "</div>" : "") +
          (st.where ? "<div class='where'>" + esc(st.where) + "</div>" : "") +
          "<div class='covers'></div>" +
        "</div>";
      // A test step and a finding are the same change seen twice, so the step
      // says which finding it would catch and takes you straight there.
      const cov = d.querySelector(".covers");
      (st.covers || []).forEach(fid => {
        const f = byId.get(fid);
        if (!f) return;
        const b = document.createElement("button");
        b.textContent = "catches: " + (f.title || fid);
        b.addEventListener("click", ev => { ev.preventDefault(); openFinding(fid); });
        cov.appendChild(b);
      });
      box.appendChild(d);
    });

    [["automated", "What the tests already cover"], ["cannot_test", "What you cannot check by hand"]]
      .forEach(([k, label]) => {
        if (!t[k]) return;
        const d = document.createElement("details");
        d.innerHTML = "<summary>" + label + "</summary><div class='dbody expect'>" +
          prose(t[k]) + "</div>";
        box.appendChild(d);
      });
  }

  function openFinding(id) {
    const f = byId.get(id);
    if (!f) return;
    openId = id;
    renderFinds();
    showPanel(f);
  }

  // The short version first, then why it matters, then the line itself, then
  // what to do, then the facts. A reader can stop anywhere and still have got
  // something.
  function showPanel(f) {
    const panel = el("panel");
    const list = findings();
    const idx = list.findIndex(x => x.id === f.id);
    const p = path(f);

    panel.className = "panel open";
    panel.dataset.sev = f.sev;
    panel.innerHTML =
      '<button class="pclose" id="panel-close" title="Close">&#x2715;</button>' +
      '<div class="pnum">' + esc(idx + 1) + " of " + list.length + "</div>" +
      "<h3>" + esc(f.title || "") + "</h3>" +
      '<div class="tldr">' + esc(f.what || "") + "</div>" +
      (f.why ? "<h4>Why it matters</h4><p>" + prose(f.why) + "</p>" : "") +
      (f.evidence ? '<h4>The code</h4><pre class="evidence">' + esc(f.evidence) + "</pre>" : "") +
      (f.fix ? '<h4>What to do</h4><div class="fix">' + prose(f.fix) + "</div>" : "") +
      "<h4>The facts</h4>" +
      '<div class="tablewrap"><table>' +
        "<tr><td>Severity</td><td>" + esc(f.sev) + " — " + esc(SEV_WORDS[f.sev] || "") + "</td></tr>" +
        "<tr><td>Kind</td><td>" + esc(f.kind || "—") + "</td></tr>" +
        (f.repo ? "<tr><td>Repo</td><td>" + esc(shortRepo(f.repo)) + "</td></tr>" : "") +
        "<tr><td>Confidence</td><td>" + esc(f.confidence || "—") + "</td></tr>" +
        "<tr><td>In this diff</td><td>" + (f.in_diff === false ? "no, already there" : "yes") + "</td></tr>" +
        "<tr><td>Function</td><td>" + esc(f.fn || "—") + (f.fn ? "()" : "") + "</td></tr>" +
        "<tr><td>File</td><td>" + esc(f.file || "—") + "</td></tr>" +
        (f.lines ? "<tr><td>Lines</td><td>" + esc(f.lines) + "</td></tr>" : "") +
        (f.callers != null ? "<tr><td>Callers found</td><td>" + esc(f.callers) + "</td></tr>" : "") +
        (f.raised_already ? "<tr><td>Already raised</td><td>someone said this on the PR</td></tr>" : "") +
      "</table></div>" +
      '<div class="pathrow"><code>' + esc(p) + '</code><button class="btn" id="panel-copy">Copy</button></div>' +
      '<h4>Your notes<span class="saved" id="note-saved">saved</span></h4>' +
      '<textarea class="note-box" id="note-box" placeholder="What did you work out about this one?"></textarea>' +
      '<div class="nav">' +
        '<button class="btn" id="panel-prev"' + (idx <= 0 ? " disabled" : "") + ">&#8592; Previous</button>" +
        '<button class="btn" id="panel-next"' + (idx >= list.length - 1 ? " disabled" : "") + ">Next &#8594;</button>" +
      "</div>";

    const box = el("note-box"), flash = el("note-saved");
    box.value = notes[f.id] || "";
    box.addEventListener("input", () => scheduleNoteSave(f.id, box.value, flash));
    el("panel-close").addEventListener("click", closePanel);
    el("panel-copy").addEventListener("click", copyBtn(p));
    el("panel-prev").addEventListener("click", () => { const t = list[idx - 1]; if (t) openFinding(t.id); });
    el("panel-next").addEventListener("click", () => { const t = list[idx + 1]; if (t) openFinding(t.id); });
  }

  function closePanel() {
    el("panel").classList.remove("open");
    openId = null;
    renderFinds();
  }

  window.addEventListener("keydown", e => { if (e.key === "Escape") closePanel(); });
  el("theme").addEventListener("click", () => {
    const cur = document.documentElement.getAttribute("data-theme");
    const next = cur === "dark" ? "light" : cur === "light" ? "dark"
      : (matchMedia("(prefers-color-scheme: dark)").matches ? "light" : "dark");
    document.documentElement.setAttribute("data-theme", next);
  });

  ingest(data);
})();
</script>
</body>
</html>
